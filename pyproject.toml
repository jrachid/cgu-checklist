[project]
name = "cgu-checklist"
version = "0.1.0"
description = "Check-list des points cruciaux des CGU, analysés par Jev"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Rachid Jeffali", email = "rachidj@protonmail.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "trafilatura>=2.2.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
cgu-checklist = "cgu_checklist:main"
cgu-checklist-server = "cgu_checklist.server:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
